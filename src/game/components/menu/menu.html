
@if (!engine.jugando() && !engine.terminado()) {

  <div class="menu-overlay">

    <h1>FLAPPY FISH</h1>

    <p>Supera las barreras de coral clicando <strong>space</strong></p>

    <p>Pulsa PLAY o espacio para comenzar</p>
    <p>Mejor puntuación: {{ engine.record() }}</p>
    <button (click)="start()">
      PLAY
    </button>

  </div>
}
